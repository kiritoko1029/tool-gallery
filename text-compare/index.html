<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在线文本对比工具，支持大文本、本地文件导入和差异高亮。"><title>对照 · 文本对比工具</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#202638;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{width:min(520px,calc(100% - 32px));padding:34px;text-align:center;background:#fff;border:1px solid #e6e8ef;border-radius:16px;box-shadow:0 12px 35px #22203c0d}.logo{width:44px;height:44px;margin:0 auto 16px;display:grid;place-items:center;color:#fff;background:#6854d9;border-radius:12px;font-weight:800;font-size:19px}h1{margin:0 0 7px;font-size:20px}p{margin:0;color:#7a8192}.bar{height:5px;margin:23px 0 13px;overflow:hidden;background:#eeecfa;border-radius:9px}.bar::after{content:"";display:block;width:42%;height:100%;background:#6854d9;border-radius:inherit;animation:load 1.15s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(138%)}}.error{color:#a43d4c}button{margin-top:18px;padding:8px 15px;border:1px solid #ddd9f1;border-radius:8px;background:#fff;color:#6854d9;cursor:pointer}</style></head><body><main aria-live="polite"><div class="logo">对</div><h1>正在载入文本对比工具</h1><p id="status">正在组装完整页面…</p><div id="progress" class="bar"></div></main><script>(()=>{const files=["https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-01.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-02.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-03.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-04a.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-04b.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-05.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-06a1.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-06a2.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-06gap.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-06b.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-07.txt", "https://raw.githubusercontent.com/kiritoko1029/kiritoko1029/main/assets/text-compare/part-08.txt"];const expectedHash="22452baf5c408e9d6d6d919e09a570e4e4efb5e657a046d56845e33b89eee99f";const status=document.getElementById('status');const hex=b=>Array.from(new Uint8Array(b),v=>v.toString(16).padStart(2,'0')).join('');async function load(){const responses=await Promise.all(files.map(path=>fetch(path,{cache:'no-cache'})));const failed=responses.find(r=>!r.ok);if(failed)throw new Error(`源码载入失败（HTTP ${failed.status}）`);const html=(await Promise.all(responses.map(r=>r.text()))).join('');if(globalThis.crypto&&crypto.subtle){status.textContent='正在校验页面完整性…';const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));if(digest!==expectedHash)throw new Error('页面完整性校验未通过');}document.open();document.write(html);document.close();}load().catch(error=>{console.error(error);document.getElementById('progress')?.remove();status.className='error';status.textContent=`${error.message||'载入失败'}。请刷新页面重试。`;const b=document.createElement('button');b.textContent='重新载入';b.onclick=()=>location.reload();status.after(b);});})();</script></body></html>
