<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具集</title>
  <meta name="description" content="我用 vibecoding 方式打造的工具程序合集" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-row">
        <div>
          <div class="eyebrow">Toolset</div>
          <h1>
            <span class="logo-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6.36 6.36l-5.6 5.6a2 2 0 1 0 2.83 2.83l5.6-5.6a4.5 4.5 0 0 0 6.36-6.36l-2.83 2.83-2.12-2.12 2.83-2.83z" transform="translate(2.5 -1)"/><path d="m9 15 6.5-6.5"/></svg>
            </span>
            工具集
          </h1>
          <p class="subtitle">我用 vibecoding 方式打造的工具程序——每张卡片记录了它由什么 AI 工具和模型塑造。</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" type="search" placeholder="搜索名称、简介、标签、工具或模型…" autocomplete="off" aria-label="搜索工具" />
        </div>
        <div class="tag-filter" id="tagFilter"></div>
      </div>
    </header>

    <main id="gallery" class="gallery-grid" aria-live="polite"></main>

    <footer class="footer">
      <span id="footCount"></span>
      <span>由 tool-gallery 驱动 · AI 可通过 MCP / REST API 维护本工具集</span>
    </footer>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
