name = "tool-gallery"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# 前台/后台静态页面直接由 Workers 静态资源服务；/api/* 与 /mcp 由 Worker 处理
[assets]
directory = "./public"

[[kv_namespaces]]
binding = "GALLERY_KV"
id = "a3ef668fde4c41d5ab741449248d2318"

# 封面图对象存储（/covers/* 由 Worker 从该 bucket 读取）
[[r2_buckets]]
binding = "COVERS"
bucket_name = "tool-gallery-covers"
