<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 工具画廊</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <!-- 令牌登录门 -->
  <div id="loginGate" class="login-gate hidden">
    <div class="big">🔐</div>
    <h2>管理后台</h2>
    <p>请输入管理员令牌。令牌在服务启动时打印于终端，默认保存在 <code>data/.admin-token</code>。</p>
    <input id="tokenInput" type="password" placeholder="管理员令牌" autocomplete="off" />
    <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center">进入后台</button>
  </div>

  <!-- 后台主体 -->
  <div id="adminApp" class="container hidden">
    <header class="site-header">
      <div class="header-row">
        <div>
          <div class="eyebrow">Admin</div>
          <h1>⚙️ 画廊管理</h1>
          <p class="subtitle">在这里登记、编辑或下架你的工具程序。改动立即写入 <code>data/tools.json</code>。</p>
        </div>
        <div style="display:flex;gap:10px">
          <a class="btn" href="/" target="_blank">🖼️ 查看画廊</a>
          <button id="logoutBtn" class="btn">退出</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <input id="adminSearch" type="search" placeholder="搜索…" autocomplete="off" />
        </div>
        <button id="addBtn" class="btn btn-primary">＋ 登记新工具</button>
      </div>
    </header>

    <main id="adminList" class="admin-list"></main>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2 id="modalTitle">登记新工具</h2>
      <form id="toolForm">
        <div class="form-grid">
          <div class="form-field">
            <label>程序名 <span class="req">*</span></label>
            <input name="name" required maxlength="60" placeholder="如：截图美化器" />
          </div>
          <div class="form-field">
            <label>图标 emoji</label>
            <input name="icon" maxlength="8" placeholder="如 📸" />
          </div>
          <div class="form-field full">
            <label>简介 <span class="req">*</span></label>
            <textarea name="description" required maxlength="300" placeholder="一句话说清楚它解决什么问题"></textarea>
          </div>
          <div class="form-field">
            <label>GitHub 地址</label>
            <input name="githubUrl" type="url" placeholder="https://github.com/you/repo（可留空）" />
          </div>
          <div class="form-field">
            <label>在线地址</label>
            <input name="link" type="url" placeholder="https://…（可留空）" />
          </div>
          <div class="form-field">
            <label>Vibecoding 工具</label>
            <input name="vibeCodingTool" list="vibeTools" placeholder="如 Kimi Code" />
            <datalist id="vibeTools">
              <option value="Kimi Code"></option>
              <option value="Claude Code"></option>
              <option value="Cursor"></option>
              <option value="Codex"></option>
              <option value="Windsurf"></option>
              <option value="Trae"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label>模型</label>
            <input name="model" list="models" placeholder="如 kimi-k2" />
            <datalist id="models">
              <option value="kimi-k2"></option>
              <option value="claude-sonnet-4"></option>
              <option value="claude-opus-4"></option>
              <option value="gpt-5"></option>
              <option value="gemini-2.5-pro"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label>最新版本</label>
            <input name="version" placeholder="如 1.2.0" />
          </div>
          <div class="form-field">
            <label>版本更新日期</label>
            <input name="versionUpdatedAt" type="date" />
            <span class="hint">修改版本号时留空则自动填今天</span>
          </div>
          <div class="form-field full">
            <label>标签（用逗号分隔）</label>
            <input name="tags" placeholder="如 cli, 图片, 效率" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
