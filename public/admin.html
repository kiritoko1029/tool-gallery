<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 工具集</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <!-- 令牌登录门 -->
  <div id="loginGate" class="login-gate hidden">
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>管理后台</h2>
    <p>请输入管理员令牌。令牌在服务启动时打印于终端，默认保存在 <code>data/.admin-token</code>。</p>
    <input id="tokenInput" type="password" placeholder="管理员令牌" autocomplete="off" />
    <button id="loginBtn" class="btn btn-primary" style="width:100%">进入后台</button>
  </div>

  <!-- 后台主体 -->
  <div id="adminApp" class="container hidden">
    <header class="site-header">
      <div class="header-row">
        <div>
          <div class="eyebrow">Admin</div>
          <h1>工具集管理</h1>
          <p class="subtitle">在这里登记、编辑或下架你的工具程序。改动立即写入数据源。</p>
        </div>
        <div style="display:flex;gap:10px">
          <a class="btn" href="/" target="_blank">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            查看前台
          </a>
          <button id="settingsBtn" class="btn" title="设置">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            设置
          </button>
          <button id="logoutBtn" class="btn">退出</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="adminSearch" type="search" placeholder="搜索…" autocomplete="off" aria-label="搜索工具" />
        </div>
        <button id="addBtn" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          登记新工具
        </button>
      </div>
    </header>

    <main id="adminList" class="admin-list"></main>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">登记新工具</h2>
      <form id="toolForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="f-name">程序名 <span class="req">*</span></label>
            <input id="f-name" name="name" required maxlength="60" placeholder="如：截图美化器" />
          </div>
          <div class="form-field">
            <label for="f-icon">图标 emoji</label>
            <input id="f-icon" name="icon" maxlength="8" placeholder="如 📸" />
          </div>
          <div class="form-field full">
            <label for="f-description">简介 <span class="req">*</span></label>
            <textarea id="f-description" name="description" required maxlength="300" placeholder="一句话说清楚它解决什么问题"></textarea>
          </div>

          <!-- 封面编辑 -->
          <div class="form-field full">
            <label>封面图（16:9）</label>
            <div class="cover-editor">
              <div class="cover-preview" id="coverPreview">
                <div class="cover-placeholder">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                  <span>暂无封面</span>
                </div>
              </div>
              <div class="cover-actions">
                <button type="button" class="btn btn-sm" id="coverUploadBtn">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  上传图片
                </button>
                <button type="button" class="btn btn-sm" id="coverCropBtn" disabled>
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.13 1 6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13 16 6a2 2 0 0 1 2 2v15"/></svg>
                  裁剪
                </button>
                <button type="button" class="btn btn-sm" id="coverAiBtn">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3m0 12v3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2M3 12h3m12 0h3M5.6 18.4l2.2-2.2m8.4-8.4 2.2-2.2"/><circle cx="12" cy="12" r="3"/></svg>
                  AI 生成
                </button>
                <button type="button" class="btn btn-sm btn-danger" id="coverRemoveBtn" disabled>移除封面</button>
              </div>
              <input id="f-cover" name="cover" type="text" placeholder="或直接粘贴图片链接 https://…" aria-label="封面图片链接" />
              <input type="file" id="coverFileInput" accept="image/*" class="hidden" />
            </div>
          </div>

          <div class="form-field">
            <label for="f-github">GitHub 地址</label>
            <input id="f-github" name="githubUrl" type="url" placeholder="https://github.com/you/repo（可留空）" />
          </div>
          <div class="form-field">
            <label for="f-link">在线地址</label>
            <input id="f-link" name="link" type="url" placeholder="https://…（可留空）" />
          </div>
          <div class="form-field">
            <label for="f-vibe">Vibecoding 工具</label>
            <input id="f-vibe" name="vibeCodingTool" list="vibeTools" placeholder="如 Kimi Code" />
            <datalist id="vibeTools">
              <option value="Kimi Code"></option>
              <option value="Claude Code"></option>
              <option value="Cursor"></option>
              <option value="Codex"></option>
              <option value="Windsurf"></option>
              <option value="Trae"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label for="f-model">模型</label>
            <input id="f-model" name="model" list="models" placeholder="如 kimi-k2" />
            <datalist id="models">
              <option value="kimi-k2"></option>
              <option value="kimi-k3"></option>
              <option value="claude-sonnet-4"></option>
              <option value="claude-opus-4"></option>
              <option value="gpt-5"></option>
              <option value="gemini-2.5-pro"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label for="f-version">最新版本</label>
            <input id="f-version" name="version" placeholder="如 1.2.0" />
          </div>
          <div class="form-field">
            <label for="f-version-date">版本更新日期</label>
            <input id="f-version-date" name="versionUpdatedAt" type="date" />
            <span class="hint">修改版本号时留空则自动填今天</span>
          </div>
          <div class="form-field full">
            <label for="f-tags">标签（用逗号分隔）</label>
            <input id="f-tags" name="tags" placeholder="如 cli, 图片, 效率" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 裁剪弹窗 -->
  <div id="cropperBackdrop" class="modal-backdrop">
    <div class="modal cropper-modal" role="dialog" aria-modal="true" aria-labelledby="cropperTitle">
      <h2 id="cropperTitle">裁剪封面（16:9）</h2>
      <div class="cropper-stage" id="cropperStage">
        <canvas id="cropperCanvas"></canvas>
      </div>
      <div class="cropper-controls">
        <label for="cropZoom">缩放</label>
        <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" />
        <button type="button" class="btn btn-sm" id="cropResetBtn">重置</button>
      </div>
      <div class="form-actions">
        <button type="button" id="cropCancelBtn" class="btn">跳过裁剪</button>
        <button type="button" id="cropConfirmBtn" class="btn btn-primary">应用裁剪</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" style="max-width:520px">
      <h2 id="settingsTitle">设置</h2>
      <form id="settingsForm">
        <div class="form-grid" style="grid-template-columns:1fr">
          <fieldset class="form-field" style="border:1px solid var(--border);border-radius:12px;padding:14px">
            <legend style="font-size:12.5px;color:var(--text-dim);padding:0 6px">AI 封面生成（OpenAI）</legend>
            <div class="form-field">
              <label for="s-apiKey">API Key</label>
              <input id="s-apiKey" type="password" autocomplete="off" placeholder="sk-…" />
              <span class="hint" id="apiKeyHint">未设置时使用环境变量 / Workers secret 中的 OPENAI_API_KEY</span>
              <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer">
                <input type="checkbox" id="s-clearKey" style="accent-color:var(--red)" /> 清除已保存的密钥
              </label>
            </div>
            <div class="form-field">
              <label for="s-baseUrl">Base URL（可选，用于代理/兼容端点）</label>
              <input id="s-baseUrl" type="url" placeholder="https://api.openai.com/v1" />
            </div>
            <div class="form-field">
              <label for="s-model">图像模型（可选）</label>
              <input id="s-model" type="text" placeholder="gpt-image-1" />
            </div>
            <div class="form-field">
              <label for="s-quality">生成质量（可选）</label>
              <select id="s-quality" style="padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit">
                <option value="">默认（medium）</option>
                <option value="low">low（快、便宜）</option>
                <option value="medium">medium</option>
                <option value="high">high（慢、精细）</option>
              </select>
            </div>
            <span class="hint">密钥只写不读：保存后无法在此查看完整值，只能覆盖或清空。页面配置优先于环境变量。</span>
          </fieldset>
        </div>
        <div class="form-actions">
          <button type="button" id="settingsCancelBtn" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
